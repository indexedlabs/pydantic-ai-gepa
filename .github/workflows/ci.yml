name: CI
on:
  pull_request:
    branches: ["*"]
permissions:
  contents: read
jobs:
  runner-git-diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          id; which -a git; namei -l /usr/bin/git; ls -ld / /usr /usr/bin /bin; stat -L -c '%n %U %u %a %F' / /usr /usr/bin /usr/bin/git /bin/git
          python3 -c "
          from pathlib import Path; import os
          p=Path('/usr/bin/git').resolve(strict=True); print('resolved', p)
          for d in [*reversed(p.parents), p]:
              i=d.stat(); print(d, i.st_uid, oct(i.st_mode))
          print('access', os.access(p, os.X_OK))"
